name: Probe job sites (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download sample pages
        run: |
          mkdir pages; cd pages
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Mobile Safari/537.36"
          for u in \
            "https://www.freejobalert.com/government-jobs/" \
            "https://www.freejobalert.com/state-government-jobs/" \
            "https://www.freejobalert.com/admit-card/" \
            "https://www.freejobalert.com/exam-results/" \
            "https://www.freejobalert.com/answer-key/" \
            "https://www.freejobalert.com/articles/gstat-recruitment-2026-stenographer-udc-assistant-3079720" \
            "https://freshershunt.in/off-campus-drive-jobs/" \
            "https://hiredoor.in/reports/off-campus" \
            "https://freshershunt.in/google-off-campus-drive-2027/"; do
            f=$(echo "$u" | sed 's#https\?://##; s#[/?=&]#_#g').html
            code=$(curl -sL -A "$UA" -o "$f" -w '%{http_code}' "$u"); echo "$code $(wc -c <"$f") $u"
          done
      - name: Save pages to the probe-pages branch
        run: |
          cd pages && git init -q && git checkout -q -b probe-pages && git add . \
            && git -c user.name=bot -c user.email=bot@example.com commit -qm pages \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-pages
