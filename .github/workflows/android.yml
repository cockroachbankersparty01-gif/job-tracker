name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle the web app into the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html icon.svg android/app/src/main/assets/

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SarkariJobTracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SarkariJobTracker-apk
          path: SarkariJobTracker.apk

      - name: Publish to the "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Remove any leftover draft releases
          for t in $(gh release list --limit 30 --json tagName,isDraft -q '.[] | select(.isDraft) | .tagName'); do
            gh release delete "$t" -y || true
          done
          NOTES="Download SarkariJobTracker.apk below and open it on your Android phone. Allow 'Install unknown apps' for your browser or file manager when asked. Jobs and screens update automatically every time the app opens; you don't need to reinstall."
          if gh release view apk-latest >/dev/null 2>&1; then
            # Keep the same release and link; just replace the file
            gh release upload apk-latest SarkariJobTracker.apk --clobber
            gh release edit apk-latest --draft=false --notes "$NOTES"
          else
            gh release create apk-latest SarkariJobTracker.apk \
              --target "${{ github.sha }}" \
              --title "JOB Alert for Android" \
              --notes "$NOTES"
          fi
          # Fail the job if the public download link does not work
          sleep 5
          curl -sfIL "https://github.com/${{ github.repository }}/releases/download/apk-latest/SarkariJobTracker.apk" > /dev/null
