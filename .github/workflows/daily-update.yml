name: Daily job data update

# Runs on GitHub's servers twice a day; no person or AI needed.
# The Android apps load data.json / pro/data.json from this repository every time they open.
on:
  schedule:
    - cron: '45 1 * * *'    # 07:15 IST
    - cron: '45 9 * * *'    # 15:15 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install requests beautifulsoup4

      - name: Update government jobs (JOB Alert)
        working-directory: scripts
        run: python update_gov.py ../data.json

      - name: Update private jobs (PRO Job Alert)
        working-directory: scripts
        run: python update_pro.py ../pro/data.json

      - name: Check the files are valid
        run: |
          python -c "import json; json.load(open('data.json')); json.load(open('pro/data.json')); print('ok')"

      - name: Save changes
        run: |
          git config user.name "job-data-bot"
          git config user.email "job-data-bot@users.noreply.github.com"
          git add data.json pro/data.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Automatic job data update $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase -q || true
          git push
