name: Build JOB Alert app

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-releases
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Bundle the web app into the app (offline fallback)
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html icon.svg android/app/src/main/assets/

      - name: Set up the upload key (if the repository secrets exist)
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signed release build"
          else
            echo "No signing secrets: building a test-signed APK and an unsigned Play bundle"
          fi

      - name: Build APK and Play Store bundle (AAB)
        working-directory: android
        run: |
          if [ -n "$KS_B64" ]; then
            gradle assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../SarkariJobTracker.apk
            cp app/build/outputs/bundle/release/app-release.aab ../SarkariJobTracker.aab
          else
            gradle assembleDebug bundleRelease --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../SarkariJobTracker.apk
            cp app/build/outputs/bundle/release/app-release.aab ../SarkariJobTracker-unsigned.aab
          fi
          ls -l ../SarkariJobTracker*

      - uses: actions/upload-artifact@v4
        with:
          name: SarkariJobTracker
          path: SarkariJobTracker*.a*

      - name: Publish to the "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --limit 30 --json tagName,isDraft -q '.[] | select(.isDraft) | .tagName'); do
            gh release delete "$t" -y || true
          done
          NOTES="JOB Alert. Phone install: download SarkariJobTracker.apk and open it (allow 'Install unknown apps' when asked). Google Play upload: use the .aab file. Listings update automatically every time the app opens."
          FILES=$(ls SarkariJobTracker*.a*)
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest $FILES --clobber
            gh release edit apk-latest --draft=false --title "JOB Alert for Android" --notes "$NOTES"
          else
            gh release create apk-latest $FILES --target "${{ github.sha }}" --title "JOB Alert for Android" --notes "$NOTES"
          fi
          sleep 5
          curl -sfIL "https://github.com/${{ github.repository }}/releases/download/apk-latest/SarkariJobTracker.apk" > /dev/null
