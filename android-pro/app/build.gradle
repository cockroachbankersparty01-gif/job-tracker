plugins {
    id 'com.android.application'
}

// Release signing: CI sets UPLOAD_KEYSTORE (path) and UPLOAD_KEY_PASSWORD from repository secrets.
def keystorePath = System.getenv('UPLOAD_KEYSTORE')

android {
    namespace 'com.projobalert.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.projobalert.app'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.2'
        manifestPlaceholders = [admobAppId: project.property('ADMOB_APP_ID')]
        resValue 'string', 'admob_banner_id', project.property('ADMOB_BANNER_ID')
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('UPLOAD_KEY_PASSWORD')
                keyAlias 'upload'
                keyPassword System.getenv('UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
}
